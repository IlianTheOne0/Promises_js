<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title></title>
	<link rel="icon" href="https://github.com/IlianTheOne0/Promises_js/blob/hm/task/assets/icons/film.svg?raw=true">
	<link rel="stylesheet" href="./styles/styles.css">
	<link rel="stylesheet" href="./styles/items/main/main-login.css">
</head>
<body>
	<header>
		<button id="language-button">
			<span>Language</span>
			<hr>
			<span>Language</span>
		</button>

		<nav>
			<a href="./add.html"><p>Add</p></a>
			<a href="./list.html"><p>Library</p></a>
			<a href="./remove.html"><p>Remove</p></a>
		</nav>
		
		<div class="account-div">
			<div>
				<p class="hidden" id="username-p"></p>
				<p class="hidden" id="email-p"></p>
				<button class="hidden" id="logout-button">Log out</button>
			</div>

			<button class="visible" id="login-button">Log in</button>
		</div>
	</header>

	<main>
		<form id="login-form">
			<h1>Login</h1>

			<label>Login: <input type="text" name="login_login-input" required></label>
			<label>Password: <input type="password" name="login_password-input" required></label>

			<button type="submit">Submit</button>
		</form>

		<form id="register-form">
			<h1>Register</h1>

			<label>Login: <input type="text" name="register_login-input" required></label>
			<label>Email: <input type="email" name="register_email-input" required></label>
			<label>Password: <input type="password" name="register_password-input" required></label>
			<label>Repeat password: <input type="password" name="register_repeat_password-input" required></label>

			<button type="submit">Submit</button>
		</form>
	</main>

	<footer>
		<p>reserved</p>
	</footer>

	<script type="module" src="../scripts/scripts.js"></script>
</body>
</html>
