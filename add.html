<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title></title>
	<link rel="icon" href="https://github.com/IlianTheOne0/Promises_js/blob/hm/task/assets/icons/film.svg?raw=true">
	<link rel="stylesheet" href="./styles/styles.css">
	<link rel="stylesheet" href="./styles/items/main/main-add.css">
</head>
<body>
	<header>
		<button id="language-button">
			<span>Language</span>
			<hr>
			<span>Language</span>
		</button>

		<nav>
			<a href="./add.html"><p>Add</p></a>
			<a href="./list.html"><p>Library</p></a>
			<a href="./remove.html"><p>Remove</p></a>
		</nav>
		
		<div class="account-div">
			<div>
				<p class="hidden" id="username-p"></p>
				<p class="hidden" id="email-p"></p>
				<button class="hidden" id="logout-button">Log out</button>
			</div>

			<button id="login-button">Log in</button>
		</div>
	</header>

	<main>
		<form id="addFilm-form">
			<h1>Add Film</h1>
			
			<div>
				<label>Title: <input type="text" name="addFilm_title-input" required></label>
				<label>Director: <input type="text" name="addFilm_director-input" required></label>
			</div>

			<div>
				<label>Genre: <input type="text" name="addFilm_genre-input" required></label>
				<label>Year: <input type="text" name="addFilm_year-input" required></label>
			</div>

			<label class="poster-label">Poster (url): <input type="text" name="addFilm_poster-input"></label>

			<button type="submit">Submit</button>
		</form>
	</main>

	<footer>
		<p>reserved</p>
	</footer>

	<script type="module" src="./scripts/scripts.js"></script>
</body>
</html>
